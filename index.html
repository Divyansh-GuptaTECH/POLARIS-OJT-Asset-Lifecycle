<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AssetLifecycle Auditor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">
  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-dark px-4 py-3 shadow-sm">
    <span class="navbar-brand mb-0 h1">IT Asset Lifecycle & Compliance Auditor</span>
    <span class="badge bg-primary">Project PST_PD_025</span>
  </nav>

  <div class="container my-4">
    <!-- KPI Summary Cards -->
    <div class="row g-3 mb-4">
      <div class="col-md-3">
        <div class="card border-0 shadow-sm text-center p-3">
          <small class="text-muted text-uppercase fw-semibold">Total Assets</small>
          <h3 class="fw-bold my-1 text-dark" id="kpi-total">5</h3>
          <small class="text-secondary">Hardware & Software</small>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card border-0 shadow-sm text-center p-3">
          <small class="text-muted text-uppercase fw-semibold">Active / Assigned</small>
          <h3 class="fw-bold my-1 text-success" id="kpi-active">4</h3>
          <small class="text-secondary">In operational use</small>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card border-0 shadow-sm text-center p-3">
          <small class="text-muted text-uppercase fw-semibold">In Repair</small>
          <h3 class="fw-bold my-1 text-warning" id="kpi-repair">1</h3>
          <small class="text-secondary">Maintenance required</small>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card border-0 shadow-sm text-center p-3">
          <small class="text-muted text-uppercase fw-semibold">Expiring in 30 Days</small>
          <h3 class="fw-bold my-1 text-danger" id="kpi-expiring">2</h3>
          <small class="text-secondary">Warranty / renewal alerts</small>
        </div>
      </div>
    </div>

    <!-- Filters & Search -->
    <div class="card border-0 shadow-sm p-3 mb-4">
      <div class="row g-2 align-items-center">
        <div class="col-md-6">
          <input type="text" id="searchInput" class="form-control" placeholder="Search by asset name, tag, or owner..." />
        </div>
        <div class="col-md-3">
          <select id="statusFilter" class="form-select">
            <option value="ALL">All Statuses</option>
            <option value="Assigned">Assigned</option>
            <option value="Active">Active</option>
            <option value="In Repair">In Repair</option>
          </select>
        </div>
        <div class="col-md-3">
          <select id="categoryFilter" class="form-select">
            <option value="ALL">All Categories</option>
            <option value="Hardware">Hardware</option>
            <option value="Software">Software</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Asset Table -->
    <div class="card border-0 shadow-sm overflow-hidden">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-dark">
            <tr>
              <th>Asset ID</th>
              <th>Name</th>
              <th>Category</th>
              <th>Assigned To</th>
              <th>Department</th>
              <th>Expiry / Warranty</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="assetTableBody">
            <!-- Dynamic rows will render here -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="src/js/app.js"></script>
</body>
</html>
